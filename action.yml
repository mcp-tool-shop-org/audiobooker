name: 'Audiobooker'
description: >-
  Generate a narrated, multi-voice audiobook from a book file
  (EPUB/PDF/DOCX/TXT/MD). Caller must use runs-on: ubuntu-latest — this
  composite installs ffmpeg via apt-get and will not work on
  windows-latest or macos-latest.
author: 'mcp-tool-shop'
branding:
  icon: 'book-open'
  color: 'orange'

inputs:
  source:
    description: 'Path to the source book (EPUB / PDF / DOCX / TXT / MD)'
    required: true
  output:
    description: 'Output audiobook path'
    required: false
    default: 'audiobook.m4b'
  format:
    description: 'Output format: m4b | mp3 | opus | flac | wav'
    required: false
    default: 'm4b'
  acx:
    description: 'Master to the ACX audio spec — RMS -23..-18 dBFS, peak <= -3, noise floor <= -60 (true/false)'
    required: false
    default: 'false'
  lang:
    description: 'Language code: en | fr | de | es | ja | it | pt'
    required: false
    default: 'en'
  cover:
    description: 'Optional cover image path (EPUB cover is auto-embedded otherwise)'
    required: false
    default: ''
  python-version:
    description: 'Python version to run audiobooker on'
    required: false
    default: '3.12'

outputs:
  audiobook:
    description: 'Path to the generated audiobook file'
    value: ${{ steps.render.outputs.audiobook }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install FFmpeg
      shell: bash
      # Composite actions have no runs-on. Callers must use ubuntu-latest
      # (or another Debian/Ubuntu image with apt-get). sudo apt-get will
      # not work on windows-latest / macos-latest.
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Install audiobooker
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      # Install THIS checkout (uses: org/repo@<tag> already fetched that
      # tag's tree). pip install "audiobooker-ai[render]" unpinned would
      # pull PyPI latest, so @v2.1.1 silently served 3.0.0 after publish.
      # The [render] extra still pulls voice-soundboard from PyPI (capped
      # by this tree's pyproject) and downloads model weights on first
      # run — expect a multi-minute, multi-GB step. Cache ~/.cache where
      # possible in the calling workflow.
      run: |
        VERSION="$(python3 "$ACTION_PATH/tools/read_project_version.py" "$ACTION_PATH/pyproject.toml")"
        if [ -z "$VERSION" ]; then
          echo "::error::Could not read [project].version from pyproject.toml"
          exit 1
        fi
        python3 -m pip install --no-cache-dir "${ACTION_PATH}[render]"
        INSTALLED="$(python3 -c "from importlib.metadata import version; print(version('audiobooker-ai'))")"
        if [ "$INSTALLED" != "$VERSION" ]; then
          echo "::error::Installed audiobooker-ai==${INSTALLED} != action pyproject ${VERSION}"
          exit 1
        fi

    - name: Render audiobook
      id: render
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        OUTPUT: ${{ inputs.output }}
        FORMAT: ${{ inputs.format }}
        ACX: ${{ inputs.acx }}
        LANG: ${{ inputs.lang }}
        COVER: ${{ inputs.cover }}
      run: |
        args=(make "$SOURCE" --lang "$LANG" --format "$FORMAT" -o "$OUTPUT")
        if [ "$ACX" = "true" ]; then
          args+=(--acx)
        fi
        if [ -n "$COVER" ]; then
          args+=(--cover "$COVER")
        fi
        audiobooker "${args[@]}"
        _delim="$(openssl rand -hex 16)"
        {
          printf 'audiobook<<%s\n' "$_delim"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$_delim"
        } >> "$GITHUB_OUTPUT"
