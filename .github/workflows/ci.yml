# --- Measured CI cost (dogfood-swarm SKILL item 8) --------------------------
# 7 billable min per push across 5 jobs (~4.3 min summed job time),
# re-measured 2026-09-14 from a clean ALL-SUCCESS run on the 3.0.0 branch:
#   34922950012 (2026-09-14): typecheck 30s, dep-audit 20s, ci(3.10) 72s,
#                              ci(3.11) 59s, ci(3.12) 75s
# This is UP from 5, and the reason is worth recording rather than just
# editing the number: the feature pass took the suite from 1708 to 1931
# tests, which pushed ci(3.10) and ci(3.12) past the 60-second line. Two
# jobs therefore round up to 2 billable minutes each instead of 1. Nothing
# about the workflow changed — the cost moved because the thing it runs
# grew, which is precisely the drift this comment exists to make visible.
# Earlier measurements, for the trend:
#   34177587368 (2026-09-08): typecheck 25s, dep-audit 21s, ci(3.10) 44s,
#                              ci(3.11) 42s, ci(3.12) 55s  -> 5 min
#   34134129731 (2026-09-07): typecheck 24s, dep-audit 13s, ci(3.10) 40s,
#                              ci(3.11) 46s, ci(3.12) 54s  -> 5 min
# The previous version of this comment (measured 2026-09-07 from run
# 34122801803) cited a FAILED run where fail-fast CANCELLED ci(3.10) and
# ci(3.12) after ~3.9 min each of real runner time — a truncated-failure
# outlier, not steady state, and roughly double the true per-push cost.
# GitHub bills per JOB, rounded UP to the minute, x2 Windows / x10 macOS, so
# billable minutes track job count, not wall time — many short jobs cost more
# than one long one. This number is measured, never estimated; re-measure
# after any change from a clean all-success run:
#   gh api repos/mcp-tool-shop-org/audiobooker/actions/runs/<id>/jobs
# Wave-2 ci-tooling amend (action injection / docker dispatch / typecheck
# ratchet / release preflight) added no CI job and did not expand the Python
# matrix. typecheck still ~30s (wrapper is milliseconds); still 5 jobs /
# 7 billable min per push. release.yml preflight is release-only.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'audiobooker/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'atlas/**'
  # Deliberately NOT paths-filtered, unlike `push` above.
  #
  # Branch protection requires ci (3.10/3.11/3.12), dep-audit and typecheck.
  # With a paths filter here, a docs-only PR fires none of them — and a
  # required check that never runs is never satisfied, so the PR blocks
  # forever. The only escapes were bypassing branch protection (which this
  # repo learned not to do: a bypassed push shipped a platform-specific bug
  # CI would have caught) or padding the PR with an unrelated code change.
  #
  # The asymmetry is the point. Pushes are frequent, so cost dominates and
  # the filter stays. PRs are infrequent and gated, so satisfiability
  # dominates. Cost of a docs PR is one full run: 7 billable minutes across
  # 5 jobs (GitHub bills each job rounded up to the minute; the summed job
  # time is ~4.3), measured on run 34922950012 — see the header block for
  # why this moved from 5.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Explicit least-privilege scope. This workflow only checks out, runs tests,
# and uploads coverage to Codecov (which takes a token, not GITHUB_TOKEN) —
# it needs no write scope. Without this block the effective token scope is
# whatever the repo/org default happens to be, which docker.yml, pages.yml
# and release.yml all avoid relying on.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      # A 3.12/3.11 fail must not cancel 3.10 before its log exists.
      # Same three cells, same billable minutes; not a second pytest leg.
      # Re-run failed jobs can then start the cell that actually broke.
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # The committed Atlas map (atlas/) must match the tree. Atlas needs
      # Node 22 or later, and the map is the same on every cell, so it is
      # checked on the 3.12 cell only.
      - name: Set up Node for Atlas
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Atlas check
        if: matrix.python-version == '3.12'
        run: npx --yes @dogfood-lab/atlas@1.20.0 check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check audiobooker/

      - name: Import gate
        run: |
          python -c "
          import audiobooker
          from audiobooker.renderer.engine import render_chapter, render_project, RenderError, RenderSummary
          from audiobooker.renderer.protocols import TTSEngine, SynthesisResult, FFmpegRunner, RunResult
          from audiobooker.renderer.ffmpeg_runner import RealFFmpegRunner
          from audiobooker.renderer.output import assemble_m4b, AssemblyResult, generate_chapter_metadata
          from audiobooker.renderer.cache_manifest import CacheManifest, load_manifest, save_manifest
          from audiobooker.renderer.hash_utils import sha256_text, sha256_json, chapter_text_hash, casting_hash, render_params_hash
          from audiobooker.casting.voice_registry import validate_voices, get_available_voices
          from audiobooker.casting.voice_suggester import VoiceSuggester, VoiceSuggestion
          from audiobooker.language.profile import LanguageProfile, get_profile, available_profiles
          from audiobooker.language.en import ENGLISH
          from audiobooker.nlp.booknlp_adapter import BookNLPAdapter, BookNLPResult
          from audiobooker.nlp.speaker_resolver import SpeakerResolver
          from audiobooker.nlp.emotion import EmotionInferencer, EmotionResult
          from audiobooker.renderer.progress import RenderProgressTracker
          from audiobooker.renderer.failure_report import RenderFailureReport
          assert get_profile('en').code == 'en'
          assert BookNLPAdapter().is_available() == False
          print('All imports OK')
          "

      # TEST-A-004: the `--ignore=tests/test_e2e_smoke.py` that used to sit on
      # this line is gone. Four of that file's six tests are pure
      # parse/cast/compile/save-load — no TTS, no ffmpeg, no network — and they
      # hold the only assertions in the suite about the golden book's parsed
      # title, author and chapter titles, and about the inline [Sarah|worried]
      # override surviving compile. They were excluded only because --ignore
      # works on FILES and they shared one with two real-binary tests. Those
      # two now live in their own class and self-skip here (voice-soundboard
      # and ffmpeg are not installed on the runner); the other four run.
      #
      # Cost: no new job, no new step, no trigger change — so the measured
      # per-push total in the header block above is unchanged by this. GitHub
      # bills per JOB rounded UP to the minute and these four tests take
      # <0.3s locally, which cannot move a rounded-up minute. Re-measure from
      # the first clean all-success run after this merges if you want the
      # receipt:
      #   gh api repos/mcp-tool-shop-org/audiobooker/actions/runs/<id>/jobs
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=audiobooker --cov-report=xml --cov-report=term-missing

      - name: Test CLI
        run: |
          audiobooker --help
          audiobooker voices --help || true
          audiobooker new --help || true

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          # Repository-level token from Settings → Secrets. Required for private
          # repos and to avoid rate-limit flakes on public repos.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # PINNED 2026-09-14 (latest at the time). This was a bare
          # `pip install pyright`, which made every pyright release a live
          # input to this job — the same shape that took the lint step from
          # clean to 369 errors when ruff floated, and the reason
          # pyproject.toml pins ruff==0.16.6 with its own note. Every other
          # tool here is pinned: Actions by SHA, the Dockerfile by digest,
          # release.yml to npm@12.0.2. This was the one hole.
          # A new pyright minor routinely tightens inference, so bump this
          # deliberately, with the [tool.pyright] block in pyproject.toml in
          # view. The job is a required check; a float would quietly change
          # what "typecheck passed" meant (and can raise the residual cap).
          pip install pyright==1.1.414

      - name: CI policy assertions
        # Planted-RED for the ci-tooling amend gates. Restore a closed
        # defect (|- interpolation, continue-on-error on a required job,
        # fail-fast: true, MAX_ERRORS>82, OIDC/npm split, dispatch
        # silent-green) and this step fails. Same typecheck job, not a
        # new billable minute.
        run: python tools/check_ci_policy.py

      - name: Pyright type-check
        # Required check. continue-on-error made it vacuous (82 residuals
        # still greened typecheck). The wrapper dumps every diagnostic,
        # fails closed on NEW file:rule identities vs
        # tools/pyright_baseline.txt, and caps count at MAX_ERRORS=82.
        # Pay down types by lowering the cap and pruning the baseline;
        # do not restore continue-on-error. No second pytest leg.
        # Per-push minutes unchanged: still 5 jobs / 7 billable min
        # (run 34922950012).
        run: python tools/check_pyright_gate.py audiobooker/

  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          pip install pip-audit
          pip install .
      # --desc for descriptions, no --strict because audiobooker-ai
      # is not on PyPI yet and pip-audit treats that as a strict error
      - run: pip-audit --desc
