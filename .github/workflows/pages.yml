name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # The site is built on pull requests too, not only on the push that
  # deploys it.
  #
  # Until 2026-09-17 it was not, and that gap took main red. Dependabot #38
  # bumped @astrojs/starlight to 0.42.1; Starlight 0.39 had removed support
  # for autogenerated sidebar groups carrying a `label`, and
  # site/astro.config.mjs still used that shape. Every required check passed
  # — none of them build the site — so the PR merged clean and the failure
  # first appeared on the deploy, after main already had it (run
  # 35265693866). A site change could not fail a PR, only a deployment.
  #
  # Paths-gated here, unlike ci.yml's PR trigger, and for the inverse
  # reason. Branch protection requires ci (3.10/3.11/3.12), dep-audit and
  # typecheck; it does not require this workflow. A paths filter on a
  # required check strands a docs-only PR behind a check that never reports
  # — which is exactly why ci.yml omits one. A paths filter on a check that
  # is not required simply keeps it quiet when no site file moved.
  #
  # Cost: one extra job, ~1 billable minute (GitHub rounds each job up), and
  # only on PRs that touch site/**. PRs that do not are unaffected.
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  # head_ref for PRs so two pushes to the same branch collapse; falls back
  # to ref on push/dispatch. Matches ci.yml.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Least privilege, scoped per job rather than workflow-wide: building
    # needs no write scope, so a PR-triggered run never carries pages:write
    # or id-token:write. Only deploy asks for those, below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      # A PR run is a build check, not a deployment — nothing consumes the
      # artifact, so skip the upload rather than pay for it.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    needs: build
    # main is the only source of the published site. A PR proves the build,
    # it never publishes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
