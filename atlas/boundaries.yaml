summary: ""
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: assets
    globs:
      - assets/**
    role: data
  - name: audiobooker
    globs:
      - audiobooker/**
    role: code
  - name: docs
    globs:
      - docs/**
    role: docs
  - name: examples
    globs:
      - examples/**
    role: code
  - name: npm
    globs:
      - npm/**
    role: docs
  - name: root
    globs:
      - "*"
    role: config
  - name: site
    globs:
      - site/**
    role: site
  - name: tests
    globs:
      - tests/**
    role: test
  - name: tools
    globs:
      - tools/**
    role: code
